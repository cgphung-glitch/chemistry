<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermochemistry Practice Lab</title>
<script>try{if(localStorage.getItem('thermo-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<style>
  :root{
    --bg: #10140f;
    --bg2: #141a13;
    --panel: #161c16;
    --panel-line: #223022;
    --grid-line: rgba(127,219,255,0.055);
    --grid-line-major: rgba(127,219,255,0.09);
    --ink: #d9e0d3;
    --ink-dim: #8ea084;
    --ink-dimmer: #5f6f58;
    --amber: #f2a93c;
    --amber-dim: #b8862f;
    --cyan: #6fd3d9;
    --cyan-dim: #3f8b8f;
    --good: #7fca6b;
    --bad: #e2685c;
    --stmt-bg: #0f1410;
    --input-bg: #0d1210;
    --sol-bg: #0d120e;
    --on-accent: #10140f;
    /* aliases used by the calculator widget */
    --panel2: #1b231b;
    --line: var(--panel-line);
    --muted: var(--ink-dim);
    --amber-ink: #10140f;
    --teal: var(--cyan);
    --teal-ink: #0b1210;
    --shadow: 0 10px 30px rgba(0,0,0,.5);
    color-scheme: dark;
    --serif: 'Iowan Old Style','Palatino Linotype','Book Antiqua', Georgia, 'Times New Roman', serif;
    --mono: 'JetBrains Mono','Fira Code','SF Mono', Consolas, Menlo, monospace;
  }
  :root[data-theme="light"]{
    --bg: #f3f0e6;
    --bg2: #ece8da;
    --panel: #fbf9f2;
    --panel-line: #d8d2bf;
    --grid-line: rgba(40,80,110,0.07);
    --grid-line-major: rgba(40,80,110,0.12);
    --ink: #22281f;
    --ink-dim: #586452;
    --ink-dimmer: #8b9482;
    --amber: #a65d00;
    --amber-dim: #dfa043;
    --cyan: #0a7480;
    --cyan-dim: #5bacb2;
    --good: #2b7a1c;
    --bad: #c0392b;
    --stmt-bg: #f6f3e8;
    --input-bg: #ffffff;
    --sol-bg: #f7f4ea;
    --on-accent: #22281f;
    --panel2: #efeadc;
    --amber-ink: #ffffff;
    --teal-ink: #ffffff;
    --shadow: 0 10px 30px rgba(60,50,20,.25);
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--grid-line-major) 1px, transparent 1px) 0 0/100% 88px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/22px 100%,
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/100% 22px,
      var(--bg);
    color:var(--ink);
    font-family: var(--serif);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--amber-dim); color:var(--on-accent); }

  a{ color:var(--cyan); }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:14px;
    border-bottom:2px solid var(--panel-line);
    padding-bottom:16px;
    margin-bottom:22px;
  }
  header.top .title-block h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:2.05rem;
    letter-spacing:.02em;
    margin:0 0 4px;
    color:var(--ink);
  }
  header.top .title-block h1 .amp{ color:var(--amber); font-style:italic; }
  header.top .title-block p{
    margin:0;
    font-family:var(--mono);
    font-size:.78rem;
    letter-spacing:.06em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  .score-plate{
    font-family:var(--mono);
    font-size:.78rem;
    color:var(--ink-dim);
    text-align:right;
    line-height:1.5;
  }
  .score-plate .num{ color:var(--cyan); font-size:1rem; }

  nav.modules{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  nav.modules label{
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  nav.modules select{
    font-family:var(--mono);
    font-size:.85rem;
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--amber);
    padding:10px 14px;
    border-radius:2px;
    cursor:pointer;
    min-width:280px;
    flex:1 1 320px;
    max-width:480px;
    transition:border-color .15s;
    appearance:none;
    -webkit-appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%),
                       linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
    background-position: calc(100% - 20px) center, calc(100% - 15px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  nav.modules select:hover{ border-color:var(--cyan-dim); }
  nav.modules select:focus{ outline:none; border-color:var(--amber); }
  nav.modules select option{
    background:var(--panel);
    color:var(--ink);
    font-family:var(--mono);
  }

  main#content{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:3px;
    padding:26px 26px 30px;
    position:relative;
  }
  main#content::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:34px;
    background:repeating-linear-gradient(
      var(--bg2) 0, var(--bg2) 24px, var(--panel-line) 25px, var(--panel-line) 26px
    );
    border-right:1px solid var(--panel-line);
    opacity:.5;
    display:none;
  }

  .module-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:6px;
  }
  .module-head h2{
    font-size:1.3rem;
    margin:0;
    color:var(--ink);
    font-weight:700;
  }
  .module-head h2 .tag{
    font-family:var(--mono);
    color:var(--amber);
    font-size:.78rem;
    margin-right:10px;
    letter-spacing:.05em;
  }
  .mod-score-badge{
    font-family:var(--mono);
    font-size:.72rem;
    color:var(--ink-dimmer);
    letter-spacing:.03em;
    border:1px solid var(--panel-line);
    padding:4px 10px;
    border-radius:2px;
    white-space:nowrap;
  }
  .module-sub{
    font-family:var(--mono);
    font-size:.75rem;
    color:var(--ink-dim);
    margin:0 0 18px;
    border-bottom:1px dashed var(--panel-line);
    padding-bottom:14px;
  }

  .problem-statement{
    background:var(--stmt-bg);
    border:1px solid var(--panel-line);
    border-left:3px solid var(--cyan-dim);
    padding:16px 18px;
    border-radius:2px;
    margin-bottom:18px;
    font-size:1rem;
    line-height:1.65;
  }
  .problem-statement .given{
    font-family:var(--mono);
    color:var(--amber);
    font-size:.95em;
  }
  .problem-statement .eq{
    font-family:var(--mono);
    display:block;
    margin:10px 0;
    color:var(--cyan);
    font-size:1.02rem;
    letter-spacing:.02em;
  }
  .problem-statement .note{
    color:var(--ink-dim);
    font-size:.85rem;
  }

  .input-grid{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:16px;
    align-items:end;
  }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{
    font-family:var(--mono);
    font-size:.72rem;
    color:var(--ink-dim);
    letter-spacing:.03em;
  }
  .field input, .field select{
    font-family:var(--mono);
    font-size:.95rem;
    background:var(--input-bg);
    border:1px solid var(--panel-line);
    color:var(--ink);
    padding:8px 10px;
    border-radius:2px;
    width:170px;
  }
  .field input:focus, .field select:focus{
    outline:none;
    border-color:var(--cyan);
  }
  .field .unit{
    font-family:var(--mono);
    font-size:.72rem;
    color:var(--ink-dimmer);
  }

  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  button.action{
    font-family:var(--mono);
    font-size:.78rem;
    letter-spacing:.04em;
    padding:9px 16px;
    border-radius:2px;
    cursor:pointer;
    background:transparent;
    transition:background .15s, color .15s;
  }
  button.primary{
    border:1px solid var(--amber-dim);
    color:var(--amber);
  }
  button.primary:hover{ background:var(--amber-dim); color:var(--on-accent); }
  button.secondary{
    border:1px solid var(--panel-line);
    color:var(--ink-dim);
  }
  button.secondary:hover{ border-color:var(--cyan-dim); color:var(--cyan); }
  button.ghost{
    border:1px solid var(--panel-line);
    color:var(--ink-dimmer);
  }
  button.ghost:hover{ color:var(--ink-dim); }

  .feedback{
    font-family:var(--mono);
    font-size:.88rem;
    padding:10px 14px;
    border-radius:2px;
    margin-bottom:14px;
    display:none;
    border:1px solid transparent;
  }
  .feedback.show{ display:block; }
  .feedback.correct{ color:var(--good); border-color:var(--good); background:rgba(127,202,107,0.08); }
  .feedback.wrong{ color:var(--bad); border-color:var(--bad); background:rgba(226,104,92,0.08); }

  .solution-box{
    display:none;
    background:var(--sol-bg);
    border:1px solid var(--panel-line);
    border-left:3px solid var(--amber-dim);
    padding:16px 18px;
    border-radius:2px;
    font-size:.92rem;
    line-height:1.7;
  }
  .solution-box.show{ display:block; }
  .solution-box h4{
    margin:0 0 8px;
    font-family:var(--mono);
    font-size:.75rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--amber);
  }
  .solution-box ol{ margin:0; padding-left:20px; }
  .solution-box li{ margin-bottom:6px; }
  .solution-box .mono{ font-family:var(--mono); color:var(--cyan); }

  .ref-table{
    font-family:var(--mono);
    font-size:.72rem;
    color:var(--ink-dimmer);
    margin-top:20px;
    border-top:1px dashed var(--panel-line);
    padding-top:12px;
  }
  .ref-table summary{ cursor:pointer; color:var(--ink-dim); }
  .ref-table table{ border-collapse:collapse; margin-top:10px; }
  .ref-table td{ padding:2px 14px 2px 0; color:var(--ink-dimmer); }
  .ref-table td.k{ color:var(--ink-dim); }

  footer.foot{
    text-align:center;
    font-family:var(--mono);
    font-size:.7rem;
    color:var(--ink-dimmer);
    margin-top:30px;
    letter-spacing:.05em;
  }

  @media (max-width:640px){
    main#content{ padding:18px 16px 22px; }
    .field input, .field select{ width:140px; }
    header.top{ flex-direction:column; align-items:flex-start; }
    .score-plate{ text-align:left; }
    nav.modules select{ min-width:0; width:100%; }
  }

  /* ---------- Floating calculator (standard widget) ---------- */
  .fab {
    position: fixed; right: 14px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; border: 0;
    background: var(--amber); color: var(--amber-ink); box-shadow: var(--shadow); z-index: 60; display: grid; place-items: center; touch-action: manipulation; cursor: pointer;
  }
  .fab svg { width: 28px; height: 28px; }
  .calc {
    position: fixed; z-index: 65; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); width: min(330px, calc(100vw - 24px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); user-select: none; -webkit-user-select: none; overflow: hidden;
    font-family: var(--mono); color: var(--ink);
  }
  .calc[hidden] { display: none; }
  .calc-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 12px; background: var(--panel2); cursor: grab; touch-action: none; font-size: 12.5px; color: var(--muted); }
  .calc-head:active { cursor: grabbing; }
  .calc-head .grip { display: flex; gap: 8px; align-items: center; }
  .calc-head .dots { letter-spacing: 2px; }
  .calc-head button { width: 38px; height: 38px; border: 0; background: transparent; border-radius: 8px; font-size: 20px; line-height: 1; color: var(--ink); cursor: pointer; }
  .disp { padding: 10px 14px 6px; text-align: right; min-height: 92px; display: flex; flex-direction: column; justify-content: flex-end; }
  .disp .expr { font-size: 15px; color: var(--muted); min-height: 22px; overflow-x: auto; white-space: nowrap; direction: rtl; text-align: left; }
  .disp .expr span { direction: ltr; unicode-bidi: plaintext; }
  .disp .res { font-size: 30px; font-weight: 600; overflow-x: auto; white-space: nowrap; line-height: 1.25; }
  .disp .res.err { color: var(--bad); font-size: 18px; }
  .disp .meta { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; }
  .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 8px 10px 10px; }
  .keys button {
    min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); font-size: 16px; padding: 0; touch-action: manipulation;
    color: var(--ink); font-family: var(--mono); cursor: pointer;
  }
  .keys button:active { transform: translateY(1px); filter: brightness(1.15); }
  .keys .fn { font-size: 13.5px; color: var(--teal); }
  .keys .op { color: var(--amber); font-weight: 600; }
  .keys .eq { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 700; }
  .keys .clr { color: var(--bad); }
  .keys .on { background: var(--teal); color: var(--teal-ink); border-color: var(--teal); }
  .calc-foot { padding: 0 10px 10px; }
  .calc-foot .btn { width: 100%; min-height: 42px; font-size: 13.5px; }
  .btn { font-family: var(--mono); border: 1px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 10px; cursor: pointer; }
  .btn.teal { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); font-weight: 600; }

  /* ---------- Reference sheet ---------- */
  .ref-overlay {
    position: fixed; inset: 0; z-index: 52; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; padding: 14px;
  }
  .ref-overlay.open { display: flex; }
  .ref-sheet {
    width: min(1000px, 100%); max-height: 92vh; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--panel-line); border-top: 3px solid var(--amber-dim);
    border-radius: 2px; box-shadow: var(--shadow);
  }
  .ref-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--panel-line); }
  .ref-head h2 { margin: 0; font-family: var(--serif); font-size: 1.25rem; color: var(--ink); }
  .ref-head h2 span { color: var(--amber); font-style: italic; }
  .ref-close {
    font-family: var(--mono); font-size: 1.3rem; line-height: 1; width: 36px; height: 36px; cursor: pointer;
    background: transparent; border: 1px solid var(--panel-line); color: var(--ink-dim); border-radius: 2px;
  }
  .ref-close:hover { color: var(--cyan); border-color: var(--cyan-dim); }
  .ref-body { overflow-y: auto; padding: 16px 18px 20px; }
  .ref-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .ref-card { background: var(--stmt-bg); border: 1px solid var(--panel-line); border-left: 3px solid var(--cyan-dim); padding: 12px 14px; border-radius: 2px; }
  .ref-card h3 { margin: 0 0 8px; font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); }
  .ref-card .rf { margin: 0 0 8px; }
  .ref-card .rf .eq { display: block; font-family: var(--mono); color: var(--cyan); font-size: .92rem; }
  .ref-card .rf .why { display: block; font-size: .8rem; color: var(--ink-dim); line-height: 1.4; }
  .ref-card .note { font-size: .78rem; color: var(--ink-dim); line-height: 1.45; margin: 4px 0 0; }
  .ref-data table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: .78rem; }
  .ref-data td { padding: 2px 8px 2px 0; color: var(--ink); border-bottom: 1px dashed var(--panel-line); }
  .ref-data td.v { text-align: right; color: var(--amber); white-space: nowrap; padding-right: 0; }
  .ref-data .unit { color: var(--ink-dimmer); font-size: .7rem; margin: 6px 0 0; font-family: var(--mono); }
  .ref-sign { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: .78rem; }
  .ref-sign th { text-align: left; color: var(--ink-dim); font-weight: 600; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--panel-line); }
  .ref-sign td { padding: 3px 8px 3px 0; border-bottom: 1px dashed var(--panel-line); color: var(--ink); }

  /* ---------- Header tools ---------- */
  .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .head-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  button.tool { border: 1px solid var(--panel-line); color: var(--ink-dim); font-family: var(--mono); font-size: .75rem; letter-spacing: .04em; padding: 7px 12px; border-radius: 2px; cursor: pointer; background: transparent; transition: background .15s, color .15s, border-color .15s; white-space: nowrap; }
  button.tool:hover { border-color: var(--cyan-dim); color: var(--cyan); }
  @media (max-width:640px){ .head-right { align-items: flex-start; } .head-tools { justify-content: flex-start; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title-block">
      <h1>Thermo<span class="amp">chem</span> Practice Lab</h1>
      <p>10 problem sets &middot; randomized values &middot; worked solutions</p>
    </div>
    <div class="head-right">
      <div class="head-tools">
        <button class="tool" id="refBtn" type="button" title="Formulas, constants and data tables">📖 Reference</button>
        <button class="tool" id="themeBtn" type="button" aria-label="Toggle dark/light theme">☀ Light</button>
      </div>
      <div class="score-plate">
        SESSION SCORE<br>
        <span class="num" id="scoreDisplay">0 / 0</span>
      </div>
    </div>
  </header>

  <nav class="modules">
    <label for="moduleSelect">Problem type</label>
    <select id="moduleSelect"></select>
  </nav>

  <main id="content"></main>

  <footer class="foot">no data leaves this page &middot; refresh to reset the session score</footer>

</div>

<div class="ref-overlay" id="refOverlay" role="dialog" aria-modal="true" aria-labelledby="refTitle">
  <div class="ref-sheet">
    <div class="ref-head">
      <h2 id="refTitle">Thermochemistry <span>Reference Sheet</span></h2>
      <button class="ref-close" id="refClose" type="button" aria-label="Close reference sheet">&times;</button>
    </div>
    <div class="ref-body" id="refBody"></div>
  </div>
</div>

<button class="fab" id="fab" type="button" aria-label="Open calculator"></button>
<div class="calc" id="calc" role="dialog" aria-label="Calculator" hidden></div>

<script>
/* ============================================================
   SHARED UTILITIES
   ============================================================ */
const R_J = 8.314;      // J / (mol K)
const R_kJ = 0.008314;  // kJ / (mol K)
const ATML_TO_J = 101.325;

let score = { correct: 0, total: 0 };
let scoreByModule = {}; // { idx: {correct,total} }, filled lazily
let currentModuleIdx = 0;

function rnd(min, max, decimals=1){
  const v = Math.random()*(max-min)+min;
  const f = Math.pow(10, decimals);
  return Math.round(v*f)/f;
}
function rndInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fmt(n, sig=4){
  if (n === undefined || n === null || isNaN(n)) return "—";
  if (Math.abs(n) < 1e-9) return "0";
  const rounded = Number(n.toPrecision(sig));
  return rounded.toString();
}
function withinTol(user, correct, relTol=0.04, absTol=0.02){
  if (isNaN(user)) return false;
  const diff = Math.abs(user - correct);
  const tol = Math.max(absTol, Math.abs(correct)*relTol);
  return diff <= tol;
}

// Reference tables
const SPECIFIC_HEAT = {
  "water (l)": 4.184, "ice": 2.09, "steam": 2.01,
  "aluminum": 0.900, "iron": 0.449, "copper": 0.385,
  "gold": 0.129, "silver": 0.235, "lead": 0.128,
  "zinc": 0.388, "ethanol": 2.44, "mercury": 0.140,
  "nickel": 0.444, "tin": 0.227, "brass": 0.380, "glass": 0.84
};
const MOLAR_MASS = {
  "CH4":16.04,"O2":32.00,"CO2":44.01,"H2O":18.02,"NH3":17.03,"N2":28.02,
  "H2":2.016,"C2H2":26.04,"C3H8":44.10,"CaCO3":100.09,"CaO":56.08,
  "C":12.01,"Fe2O3":159.69,"Al":26.98,"C2H6":30.07,"C6H12":84.16,
  "C2H5OH":46.07,"NaOH":40.00,"HCl":36.46
};
const HF = {
  "CO2(g)":-393.5, "H2O(l)":-285.8, "H2O(g)":-241.8, "CH4(g)":-74.8,

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function updateScore(){
  document.getElementById("scoreDisplay").textContent = `${score.correct} / ${score.total}`;
  const badge = document.getElementById("modScoreBadge");
  if(badge){
    const s = scoreByModule[currentModuleIdx] || {correct:0,total:0};
    badge.textContent = `this set: ${s.correct} / ${s.total}`;
  }
}

function feedbackHTML(){
  return `<div class="feedback" id="fb"></div>`;
}
function solutionHTML(){
  return `<div class="solution-box" id="sol"><h4>Worked Solution</h4><ol id="solSteps"></ol></div>`;
}
function btnRowHTML(){
  return `<div class="btn-row">
    <button class="action primary" id="checkBtn">Check Answer</button>
    <button class="action secondary" id="solBtn">Show Solution</button>
    <button class="action ghost" id="newBtn">New Problem</button>
  </div>`;
}

function wireCommonButtons(mod){
  document.getElementById("newBtn").onclick = () => loadModule(mod.idx);
  document.getElementById("solBtn").onclick = () => {
    document.getElementById("sol").classList.toggle("show");
  };
  document.getElementById("checkBtn").onclick = () => mod.check();
}

function setSteps(stepsArr){
  const ol = document.getElementById("solSteps");
  ol.innerHTML = stepsArr.map(s => `<li>${s}</li>`).join("");
}

function showFeedback(isCorrect, correctText){
  const fb = document.getElementById("fb");
  score.total++;
  if(isCorrect) score.correct++;
  if(!scoreByModule[currentModuleIdx]) scoreByModule[currentModuleIdx] = {correct:0,total:0};
  scoreByModule[currentModuleIdx].total++;
  if(isCorrect) scoreByModule[currentModuleIdx].correct++;
  updateScore();
  fb.className = "feedback show " + (isCorrect ? "correct" : "wrong");
  fb.textContent = isCorrect
    ? "✓ Correct — nicely done."
    : `✗ Not quite. Correct answer: ${correctText}. Try "Show Solution" for the full derivation.`;
}

function gv(id){ return parseFloat(document.getElementById(id).value); }

/* ============================================================
   MODULE 1 — P/V WORK
   ============================================================ */
const Mod1 = {
  idx:0, title:"P–V Work",
  render(){
    const dir = choice(["expand","compress"]);
    const Pext = rnd(0.8, 5.0, 1);
    const Vi = rnd(2, 8, 1);
    let Vf;
    if(dir==="expand") Vf = rnd(Vi+1.5, Vi+7, 1);
    else Vf = rnd(Math.max(0.5,Vi-6), Vi-1.5, 1);
    const dV = Vf - Vi;
    const w_Latm = -Pext*dV;
    const w_J = w_Latm*ATML_TO_J;
    this.answer = w_J;
    this.data = {Pext,Vi,Vf,dV,w_Latm,w_J,dir};

    document.getElementById("content").innerHTML = `
      <div class="module-head"><h2><span class="tag">01</span>P–V Work</h2></div>
      <p class="module-sub">Work done on/by a gas at constant external pressure &middot; w = −P<sub>ext</sub>ΔV</p>
      <div class="problem-statement">
        A gas sample ${dir==="expand" ? "expands" : "is compressed"} against a constant external pressure of
        <span class="given">${fmt(Pext)} atm</span>, from an initial volume of
        <span class="given">${fmt(Vi)} L</span> to a final volume of <span class="given">${fmt(Vf)} L</span>.
        <span class="eq">w = −P<sub>ext</sub> · ΔV</span>
        <span class="note">Sign convention: w &gt; 0 means work is done <em>on</em> the system (compression by the surroundings); w &lt; 0 means the system does work on the surroundings (expansion). 1 L·atm = 101.325 J.</span>
      </div>
      <div class="input-grid">
        <div class="field"><label>Work done, w</label><input type="number" step="any" id="ans1"><span class="unit">J</span></div>
      </div>
      ${btnRowHTML()}
      ${feedbackHTML()}
      ${solutionHTML()}
    `;
    wireCommonButtons(this);
  },
  check(){
    const user = gv("ans1");
    const ok = withinTol(user, this.answer, 0.04, 5);
    showFeedback(ok, `${fmt(this.answer)} J (${fmt(this.data.w_Latm)} L·atm)`);
  },
  solution(){
    const d = this.data;
    setSteps([
      `Identify ΔV = V<sub>f</sub> − V<sub>i</sub> = ${fmt(d.Vf)} − ${fmt(d.Vi)} = <span class="mono">${fmt(d.dV)} L</span>`,
      `Apply w = −P<sub>ext</sub>ΔV = −(${fmt(d.Pext)})(${fmt(d.dV)}) = <span class="mono">${fmt(d.w_Latm)} L·atm</span>`,
      `Convert to joules: ${fmt(d.w_Latm)} L·atm × 101.325 J/(L·atm) = <span class="mono">${fmt(d.w_J)} J</span>`,
      `Sign check: the gas ${d.dir==="expand" ? "expanded, so it did work on the surroundings (w is negative — energy leaves the system)" : "was compressed, so the surroundings did work on it (w is positive — energy enters the system)"}.`
    ]);
  }
};

/* ============================================================
   MODULE 2 — HEAT & WORK (FIRST LAW)
   ============================================================ */
const Mod2 = {
  idx:1, title:"Heat & Work",
  render(){
    const q = rnd(-450,450,0);
    const w = rnd(-300,300,0);
    const dU = q+w;
    const unknown = choice(["dU","q","w"]);
    this.unknown = unknown;
    this.data = {q,w,dU};
    this.answer = unknown==="dU" ? dU : unknown==="q" ? q : w;

    let given, ask;
    if(unknown==="dU"){
      given = `q = <span class="given">${fmt(q)} J</span> and w = <span class="given">${fmt(w)} J</span>`;
      ask = "internal energy change, ΔU";
    } else if(unknown==="q"){
      given = `ΔU = <span class="given">${fmt(dU)} J</span> and w = <span class="given">${fmt(w)} J</span>`;
      ask = "heat, q";
    } else {
      given = `ΔU = <span class="given">${fmt(dU)} J</span> and q = <span class="given">${fmt(q)} J</span>`;
      ask = "work, w";
    }

    document.getElementById("content").innerHTML = `
      <div class="module-head"><h2><span class="tag">02</span>Heat &amp; Work</h2></div>
      <p class="module-sub">First Law of Thermodynamics &middot; ΔU = q + w</p>
      <div class="problem-statement">
        For a process, ${given}. Find the ${ask}.
        <span class="eq">ΔU = q + w</span>
        <span class="note">Convention: q &gt; 0 = heat absorbed (q &lt; 0 = heat released); w &gt; 0 = work done on the system (w &lt; 0 = work done by the system).</span>
      </div>
      <div class="input-grid">
        <div class="field"><label>Answer</label><input type="number" step="any" id="ans1"><span class="unit">J</span></div>
      </div>
      ${btnRowHTML()}
      ${feedbackHTML()}
      ${solutionHTML()}
    `;
    wireCommonButtons(this);
  },
  check(){
    const ok = withinTol(gv("ans1"), this.answer, 0.03, 2);
    showFeedback(ok, `${fmt(this.answer)} J`);
  },
  solution(){
    const d = this.data;
    let steps;
    if(this.unknown==="dU"){
      steps = [
        `Start from the First Law: ΔU = q + w`,
        `Substitute: ΔU = (${fmt(d.q)}) + (${fmt(d.w)})`,
        `ΔU = <span class="mono">${fmt(d.dU)} J</span>`
      ];
    } else if(this.unknown==="q"){
      steps = [
        `Start from the First Law: ΔU = q + w, so q = ΔU − w`,
        `Substitute: q = (${fmt(d.dU)}) − (${fmt(d.w)})`,
        `q = <span class="mono">${fmt(d.q)} J</span>`
      ];
    } else {
      steps = [
        `Start from the First Law: ΔU = q + w, so w = ΔU − q`,
        `Substitute: w = (${fmt(d.dU)}) − (${fmt(d.q)})`,
        `w = <span class="mono">${fmt(d.w)} J</span>`
      ];
    }
    setSteps(steps);
  }
};

/* ============================================================
   MODULE 3 — THERMOCHEMICAL EQUATIONS
   ============================================================ */
const RXN_BANK = [
  { eq:"CH4(g) + 2 O2(g) → CO2(g) + 2 H2O(l)", dH:-890.3, key:"CH4", coeff:1, mm:"CH4" },
  { eq:"2 H2(g) + O2(g) → 2 H2O(l)", dH:-571.6, key:"H2", coeff:2, mm:"H2" },
  { eq:"N2(g) + 3 H2(g) → 2 NH3(g)", dH:-92.2, key:"NH3", coeff:2, mm:"NH3" },
  { eq:"CaCO3(s) → CaO(s) + CO2(g)", dH:179.0, key:"CaCO3", coeff:1, mm:"CaCO3" },
  { eq:"C3H8(g) + 5 O2(g) → 3 CO2(g) + 4 H2O(l)", dH:-2220.0, key:"C3H8", coeff:1, mm:"C3H8" },
  { eq:"2 C2H2(g) + 5 O2(g) → 4 CO2(g) + 2 H2O(l)", dH:-2599.0, key:"C2H2", coeff:2, mm:"C2H2" },
];
const Mod3 = {
  idx:2, title:"Thermochemical Eq.",
  render(){
    const r = choice(RXN_BANK);
    const mode = choice(["mass","reverse","scale"]);
    this.mode = mode; this.rxn = r;

    if(mode==="mass"){
      const massMult = rnd(0.5,4,1);
      const mm = MOLAR_MASS[r.mm];
      const mass = Number((massMult*r.coeff*mm).toFixed(1)); // grams of key species
      const molesKey = mass/mm;
      const scale = molesKey/r.coeff;
      const dH_ans = r.dH*scale;
      this.answer = dH_ans;
      this.data = {r,mass,mm,molesKey,scale,dH_ans};

      document.getElementById("content").innerHTML = `
        <div class="module-head"><h2><span class="tag">03</span>Thermochemical Equations</h2></div>
        <p class="module-sub">Scaling ΔH to a given mass of reactant</p>
        <div class="problem-statement">
          Given the thermochemical equation:
          <span class="eq">${r.eq}&nbsp;&nbsp;&nbsp;ΔH = ${fmt(r.dH)} kJ</span>
          How much heat is released or absorbed when <span class="given">${fmt(mass)} g</span> of
          <span class="given">${r.key}</span> reacts completely? (Molar mass of ${r.key} = ${mm} g/mol)
        </div>
        <div class="input-grid">
          <div class="field"><label>ΔH for this amount</label><input type="number" step="any" id="ans1"><span class="unit">kJ</span></div>
        </div>
        ${btnRowHTML()}${feedbackHTML()}${solutionHTML()}
      `;
    } else if(mode==="reverse"){
      const dH_ans = -r.dH;
      this.answer = dH_ans;
      this.data = {r,dH_ans};
      document.getElementById("content").innerHTML = `
        <div class="module-head"><h2><span class="tag">03</span>Thermochemical Equations</h2></div>
        <p class="module-sub">Reversing a thermochemical equation</p>
        <div class="problem-statement">
          Given: <span class="eq">${r.eq}&nbsp;&nbsp;&nbsp;ΔH = ${fmt(r.dH)} kJ</span>
          What is ΔH for the <em>reverse</em> reaction (products → reactants)?
        </div>
        <div class="input-grid">
          <div class="field"><label>ΔH (reverse rxn)</label><input type="number" step="any" id="ans1"><span class="unit">kJ</span></div>
        </div>
        ${btnRowHTML()}${feedbackHTML()}${solutionHTML()}
      `;
    } else {
      const factor = choice([2,3,0.5]);
      const dH_ans = r.dH*factor;
      this.answer = dH_ans;
      this.factor = factor;
      this.data = {r,dH_ans,factor};
      document.getElementById("content").innerHTML = `
        <div class="module-head"><h2><span class="tag">03</span>Thermochemical Equations</h2></div>
        <p class="module-sub">Scaling all coefficients of an equation</p>
        <div class="problem-statement">
          Given: <span class="eq">${r.eq}&nbsp;&nbsp;&nbsp;ΔH = ${fmt(r.dH)} kJ</span>
          If every coefficient in the equation is multiplied by <span class="given">${factor}</span>, what is the new ΔH?
        </div>
        <div class="input-grid">
          <div class="field"><label>New ΔH</label><input type="number" step="any" id="ans1"><span class="unit">kJ</span></div>
        </div>
        ${btnRowHTML()}${feedbackHTML()}${solutionHTML()}
      `;
    }
    wireCommonButtons(this);
  },
  check(){
    const ok = withinTol(gv("ans1"), this.answer, 0.04, 3);
    showFeedback(ok, `${fmt(this.answer)} kJ`);
  },
  solution(){
    const d = this.data;
    if(this.mode==="mass"){
      setSteps([
        `Convert mass to moles: n = mass / molar mass = ${fmt(d.mass)} g ÷ ${d.mm} g/mol = <span class="mono">${fmt(d.molesKey)} mol</span> of ${d.r.key}`,
        `The equation as written involves ${d.r.coeff} mol of ${d.r.key} releasing/absorbing ${fmt(d.r.dH)} kJ.`,
        `Scale factor = (moles reacted) / (coefficient in equation) = ${fmt(d.molesKey)} / ${d.r.coeff} = <span class="mono">${fmt(d.scale)}</span>`,
        `ΔH = scale × ΔH°<sub>rxn</sub> = ${fmt(d.scale)} × (${fmt(d.r.dH)}) = <span class="mono">${fmt(d.dH_ans)} kJ</span>`
      ]);
    } else if(this.mode==="reverse"){
      setSteps([
        `Reversing a reaction flips the sign of ΔH (energy released becomes energy required, and vice versa).`,
        `ΔH<sub>reverse</sub> = −ΔH<sub>forward</sub> = −(${fmt(d.r.dH)}) = <span class="mono">${fmt(d.dH_ans)} kJ</span>`
      ]);
    } else {
      setSteps([
        `Thermochemical ΔH values scale linearly with the stoichiometric coefficients.`,
        `Multiplying every coefficient by ${d.factor} multiplies ΔH by the same factor.`,
        `New ΔH = ${d.factor} × (${fmt(d.r.dH)}) = <span class="mono">${fmt(d.dH_ans)} kJ</span>`
      ]);
    }
  }
};

/* ============================================================
   MODULE 4 — INTERNAL ENERGY OF REACTION (ΔU from ΔH)
   ============================================================ */
const RXN4_BANK = [
  { eq:"N2(g) + 3 H2(g) → 2 NH3(g)", dngas: 2-4 },
  { eq:"2 CO(g) + O2(g) → 2 CO2(g)", dngas: 2-3 },
  { eq:"C3H8(g) + 5 O2(g) → 3 CO2(g) + 4 H2O(g)", dngas: 7-6 },
  { eq:"2 H2(g) + O2(g) → 2 H2O(g)", dngas: 2-3 },
  { eq:"CaCO3(s) → CaO(s) + CO2(g)", dngas: 1-0 },
  { eq:"N2O4(g) → 2 NO2(g)", dngas: 2-1 },
];
const Mod4 = {
  idx:3, title:"Internal Energy (ΔU)",
  render(){
    const r = choice(RXN4_BANK);
    const dH = rnd(-800,200,1);
    const T = rndInt(280,400);
    const dU = dH - r.dngas*R_kJ*T;
    this.answer = dU;
    this.data = {r,dH,T,dU};

    document.getElementById("content").innerHTML = `
      <div class="module-head"><h2><span class="tag">04</span>Internal Energy of Reaction</h2></div>
      <p class="module-sub">ΔU = ΔH − Δn<sub>gas</sub>RT</p>
      <div class="problem-statement">
        For the reaction: <span class="eq">${r.eq}</span>
        ΔH = <span class="given">${fmt(dH)} kJ</span> at T = <span class="given">${T} K</span>.
        Calculate ΔU for the reaction.
        <span class="note">R = 8.314 J/(mol·K) = 0.008314 kJ/(mol·K). Δn<sub>gas</sub> = moles gaseous products − moles gaseous reactants.</span>
      </div>
      <div class="input-grid">
        <div class="field"><label>ΔU</label><input type="number" step="any" id="ans1"><span class="unit">kJ</span></div>
      </div>
      ${btnRowHTML()}${feedbackHTML()}${solutionHTML()}
    `;
    wireCommonButtons(this);
  },
  check(){
    const ok = withinTol(gv("ans1"), this.answer, 0.03, 1);
    showFeedback(ok, `${fmt(this.answer)} kJ`);
  },
  solution(){
    const d = this.data;
    setSteps([
      `Determine Δn<sub>gas</sub> from the balanced equation: Δn<sub>gas</sub> = <span class="mono">${d.r.dngas}</span> mol`,
      `Apply ΔU = ΔH − Δn<sub>gas</sub>RT`,
      `ΔU = ${fmt(d.dH)} − (${d.r.dngas})(0.008314)(${d.T})`,
      `ΔU = ${fmt(d.dH)} − (${fmt(d.r.dngas*R_kJ*d.T)}) = <span class="mono">${fmt(d.dU)} kJ</span>`
    ]);
  }
};

/* ============================================================
   MODULE 5 — SPECIFIC HEAT
   ============================================================ */
const Mod5 = {
  idx:4, title:"Specific Heat",
  render(){
    const substances = Object.keys(SPECIFIC_HEAT);
    const sub = choice(substances);
    const c = SPECIFIC_HEAT[sub];
    const m = rnd(10,250,1);
    const Ti = rnd(15,30,1);
    const Tf = rnd(35,95,1);
    const dT = Tf-Ti;
    const q = m*c*dT;
    const unknown = choice(["q","m","dT_Tf"]);
    this.unknown = unknown;
    this.data = {sub,c,m,Ti,Tf,dT,q};

    let statement, label, unit;
    if(unknown==="q"){
      this.answer = q;
      label = "Heat absorbed, q"; unit="J";
      statement = `A ${fmt(m)} g sample of ${sub} (specific heat c = ${c} J/(g·°C)) is heated from ${fmt(Ti)} °C to ${fmt(Tf)} °C. Find the heat absorbed.`;
    } else if(unknown==="m"){
      this.answer = m;
      label = "Mass, m"; unit="g";
      statement = `A sample of ${sub} (specific heat c = ${c} J/(g·°C)) absorbs <span class="given">${fmt(q)} J</span> of heat as its temperature rises from ${fmt(Ti)} °C to ${fmt(Tf)} °C. Find the mass of the sample.`;
    } else {
      this.answer = Tf;
      label = "Final temperature, T_f"; unit="°C";
      statement = `A ${fmt(m)} g sample of ${sub} (specific heat c = ${c} J/(g·°C)) at an initial temperature of ${fmt(Ti)} °C absorbs <span class="given">${fmt(q)} J</span> of heat. Find the final temperature.`;
    }

    document.getElementById("content").innerHTML = `
      <div class="module-head"><h2><span class="tag">05</span>Specific Heat</h2></div>
      <p class="module-sub">q = m·c·ΔT</p>
      <div class="problem-statement">${statement}
        <span class="eq">q = m c ΔT</span>
      </div>
      <div class="input-grid">
        <div class="field"><label>${label}</label><input type="number" step="any" id="ans1"><span class="unit">${unit}</span></div>
      </div>
      ${btnRowHTML()}${feedbackHTML()}${solutionHTML()}
    `;
    wireCommonButtons(this);
  },
  check(){
    const tol = this.unknown==="q" ? 0.04 : 0.03;
    const ok = withinTol(gv("ans1"), this.answer, tol, this.unknown==="q"?5:0.3);
    const unit = this.unknown==="q" ? "J" : this.unknown==="m" ? "g" : "°C";
    showFeedback(ok, `${fmt(this.answer)} ${unit}`);
  },
  solution(){
    const d = this.data;
    let steps;
    if(this.unknown==="q"){
      steps = [
        `ΔT = T<sub>f</sub> − T<sub>i</sub> = ${fmt(d.Tf)} − ${fmt(d.Ti)} = <span class="mono">${fmt(d.dT)} °C</span>`,
        `q = m c ΔT = (${fmt(d.m)})(${d.c})(${fmt(d.dT)})`,
        `q = <span class="mono">${fmt(d.q)} J</span>`
      ];
    } else if(this.unknown==="m"){
      steps = [
        `ΔT = ${fmt(d.Tf)} − ${fmt(d.Ti)} = <span class="mono">${fmt(d.dT)} °C</span>`,
        `Rearrange q = mcΔT → m = q / (cΔT)`,
        `m = ${fmt(d.q)} / [(${d.c})(${fmt(d.dT)})] = <span class="mono">${fmt(d.m)} g</span>`
      ];
    } else {
      steps = [
        `Rearrange q = mcΔT → ΔT = q / (mc)`,
        `ΔT = ${fmt(d.q)} / [(${fmt(d.m)})(${d.c})] = <span class="mono">${fmt(d.dT)} °C</span>`,
        `T<sub>f</sub> = T<sub>i</sub> + ΔT = ${fmt(d.Ti)} + ${fmt(d.dT)} = <span class="mono">${fmt(d.Tf)} °C</span>`
      ];
    }
    setSteps(steps);
  }
};

/* ============================================================
   MODULE 6 — CONSTANT VOLUME (BOMB) CALORIMETRY
   ============================================================ */
const Mod6 = {
  idx:5, title:"Bomb Calorimetry",
  render(){
    const mode = choice(["findHeat","findDT"]);
    this.mode = mode;
    const Ccal = rnd(4.5,12,2); // kJ/°C
    const mass = rnd(0.5,3.0,2); // g fuel
    const mm = choice([46.07,16.04,114.23,180.16]); // e.g. ethanol, methane, octane, glucose-ish
    const mmName = mm===46.07?"C2H5OH":mm===16.04?"CH4":mm===114.23?"C8H18":"C6H12O6";

    if(mode==="findHeat"){
      const dT = rnd(2.0,7.5,2);
      const q_cal = Ccal*dT; // kJ absorbed by calorimeter (positive)
      const q_rxn = -q_cal; // heat released by combustion
      const molarHeat = q_rxn/(mass/mm);
      this.answer = molarHeat;
      this.data = {Ccal,mass,mm,mmName,dT,q_cal,q_rxn,molarHeat};

      document.getElementById("content").innerHTML = `
        <div class="module-head"><h2><span class="tag">06</span>Constant-Volume (Bomb) Calorimetry</h2></div>
        <p class="module-sub">q<sub>rxn</sub> = −C<sub>cal</sub>ΔT &middot; find molar heat of combustion</p>
        <div class="problem-statement">
          A <span class="given">${fmt(mass)} g</span> sample of ${mmName} (molar mass ${mm} g/mol) is burned completely in a bomb calorimeter with heat capacity
          <span class="given">${fmt(Ccal)} kJ/°C</span>. The temperature rises by <span class="given">${fmt(dT)} °C</span>.
          Calculate the molar heat of combustion (kJ/mol).
          <span class="eq">q<sub>rxn</sub> = −C<sub>cal</sub>ΔT</span>
        </div>
        <div class="input-grid">
          <div class="field"><label>Molar heat of combustion</label><input type="number" step="any" id="ans1"><span class="unit">kJ/mol</span></div>
        </div>
        ${btnRowHTML()}${feedbackHTML()}${solutionHTML()}
      `;
    } else {
      const molarHeat = -rnd(600,2800,0); // kJ/mol, exothermic
      const moles = mass/mm;
      const q_rxn = molarHeat*moles;
      const dT = -q_rxn/Ccal;

/* ============================================================

const HESS_TEMPLATES = [
  {
    target:"C(s) + O2(g) → CO2(g)",
    given:[
      {eq:"C(s) + 1/2 O2(g) → CO(g)", range:[-130,-90]},
      {eq:"CO(g) + 1/2 O2(g) → CO2(g)", range:[-300,-260]}
    ],
    combine:(h)=> h[0]+h[1],
    steps:(h,ans)=>[
      `Add the two given equations directly: the intermediate CO(g) cancels since it appears as a product in equation 1 and a reactant in equation 2.`,
      `ΔH<sub>target</sub> = ΔH₁ + ΔH₂ = (${fmt(h[0])}) + (${fmt(h[1])}) = <span class="mono">${fmt(ans)} kJ</span>`
    ]
  },
  {
    target:"2 NO(g) + O2(g) → 2 NO2(g)",
    given:[
      {eq:"N2(g) + O2(g) → 2 NO(g)", range:[150,200]},
      {eq:"N2(g) + 2 O2(g) → 2 NO2(g)", range:[50,90]}
    ],
    combine:(h)=> h[1]-h[0],
    steps:(h,ans)=>[
      `Reverse equation 1 so that NO(g) appears as a reactant, matching the target: 2 NO(g) → N2(g) + O2(g), ΔH = −ΔH₁ = ${fmt(-h[0])} kJ`,
      `Keep equation 2 as written: N2(g) + 2 O2(g) → 2 NO2(g), ΔH₂ = ${fmt(h[1])} kJ`,
      `Add the reversed equation 1 and equation 2 — N2(g) and one O2(g) cancel, leaving the target.`,
      `ΔH<sub>target</sub> = −ΔH₁ + ΔH₂ = ${fmt(-h[0])} + ${fmt(h[1])} = <span class="mono">${fmt(ans)} kJ</span>`
    ]
  },
  {
    target:"N2(g) + O2(g) → 2 NO(g)",
    given:[
      {eq:"1/2 N2(g) + 1/2 O2(g) → NO(g)", range:[80,100]}
    ],
    combine:(h)=> 2*h[0],
    steps:(h,ans)=>[
      `The target has exactly double the coefficients of the given equation.`,
      `Multiply the given equation (and its ΔH) by 2: ΔH<sub>target</sub> = 2 × ΔH₁ = 2 × (${fmt(h[0])}) = <span class="mono">${fmt(ans)} kJ</span>`
    ]
  },
  {
    target:"S(s) + 3/2 O2(g) → SO3(g)",
    given:[
      {eq:"S(s) + O2(g) → SO2(g)", range:[-320,-280]},
      {eq:"2 SO2(g) + O2(g) → 2 SO3(g)", range:[-220,-170]}
    ],
    combine:(h)=> h[0]+0.5*h[1],
    steps:(h,ans)=>[
      `Keep equation 1 as written: S(s) + O2(g) → SO2(g), ΔH₁ = ${fmt(h[0])} kJ.`,
      `Halve equation 2 so only 1 mol SO2(g) reacts: SO2(g) + 1/2 O2(g) → SO3(g), ΔH = ΔH₂/2 = ${fmt(h[1]/2)} kJ.`,
      `Add the two — SO2(g) cancels (produced in step 1, consumed in step 2) — leaving the target.`,
      `ΔH<sub>target</sub> = ΔH₁ + ½ΔH₂ = ${fmt(h[0])} + ${fmt(h[1]/2)} = <span class="mono">${fmt(ans)} kJ</span>`
    ]
  },
  {
    target:"C(s, graphite) → C(s, diamond)",
    given:[
      {eq:"C(s, graphite) + O2(g) → CO2(g)", range:[-400,-390]},
      {eq:"C(s, diamond) + O2(g) → CO2(g)", range:[-398,-392]}
    ],
    combine:(h)=> h[0]-h[1],
    steps:(h,ans)=>[
      `Keep equation 1 as written (graphite is a reactant, matching target): ΔH₁ = ${fmt(h[0])} kJ.`,
      `Reverse equation 2 so CO2(g) is a reactant and diamond is a product: CO2(g) → C(s, diamond) + O2(g), ΔH = −ΔH₂ = ${fmt(-h[1])} kJ.`,
      `Add — O2(g) and CO2(g) both cancel, leaving the target.`,
      `ΔH<sub>target</sub> = ΔH₁ − ΔH₂ = ${fmt(h[0])} − ${fmt(h[1])} = <span class="mono">${fmt(ans)} kJ</span>`
    ]
  },
  {
    target:"CH4(g) + 2 O2(g) → CO2(g) + 2 H2O(l)",
    given:[
      {eq:"C(s) + 2 H2(g) → CH4(g)", range:[-90,-60]},
      {eq:"C(s) + O2(g) → CO2(g)", range:[-400,-390]},
      {eq:"H2(g) + 1/2 O2(g) → H2O(l)", range:[-290,-280]}

    combine:(h)=> -h[0]+h[1]+2*h[2],
    steps:(h,ans)=>[
      `Reverse equation 1 so CH4(g) is a reactant: CH4(g) → C(s) + 2 H2(g), ΔH = −ΔH₁ = ${fmt(-h[0])} kJ.`,
      `Keep equation 2 as written: C(s) + O2(g) → CO2(g), ΔH₂ = ${fmt(h[1])} kJ.`,

      `Add all three — C(s) and 2 H2(g) cancel — leaving the target.`,
      `ΔH<sub>target</sub> = −ΔH₁ + ΔH₂ + 2ΔH₃ = ${fmt(-h[0])} + ${fmt(h[1])} + ${fmt(2*h[2])} = <span class="mono">${fmt(ans)} kJ</span>`
    ]
  }

                        ...r.prod.map(([n,c])=>`<tr><td class="k">${n}</td><td>${c} mol</td><td>${HF[n]} kJ/mol</td></tr>`)].join("");

      <div class="module-head"><h2><span class="tag">10</span>Hess's Law from ΔH<sub>f</sub>°</h2></div>
      <p class="module-sub">ΔH°<sub>rxn</sub> = ΣnΔH<sub>f</sub>°(products) − ΣnΔH<sub>f</sub>°(reactants)</p>
      <div class="problem-statement">
        Calculate ΔH°<sub>rxn</sub> for:
        <span class="eq">${r.eq}</span>
        using standard heats of formation (table below).
      </div>
      <details class="ref-table" open>
        <summary>Standard heats of formation, ΔH<sub>f</sub>° (kJ/mol)</summary>
        <table>
          <tr><td class="k">species</td><td>coeff.</td><td>ΔH<sub>f</sub>°</td></tr>
          ${tableRows}
        </table>
      </details>
      <div class="input-grid" style="margin-top:16px;">
        <div class="field"><label>ΔH°<sub>rxn</sub></label><input type="number" step="any" id="ans1"><span class="unit">kJ</span></div>
      </div>
      ${btnRowHTML()}${feedbackHTML()}${solutionHTML()}
    `;
    wireCommonButtons(this);
  },
  check(){
    const ok = withinTol(gv("ans1"), this.answer, 0.03, 2);
    showFeedback(ok, `${fmt(this.answer)} kJ`);
  },
  solution(){
    const d = this.data;
    const prodTerms = d.r.prod.map(([n,c])=>`${c}(${HF[n]})`).join(" + ");
    const reactTerms = d.r.react.map(([n,c])=>`${c}(${HF[n]})`).join(" + ");
    setSteps([
      `ΣnΔH<sub>f</sub>°(products) = ${prodTerms} = <span class="mono">${fmt(d.sumProd)} kJ</span>`,
      `ΣnΔH<sub>f</sub>°(reactants) = ${reactTerms} = <span class="mono">${fmt(d.sumReact)} kJ</span>`,
      `ΔH°<sub>rxn</sub> = ΣnΔH<sub>f</sub>°(products) − ΣnΔH<sub>f</sub>°(reactants) = ${fmt(d.sumProd)} − (${fmt(d.sumReact)}) = <span class="mono">${fmt(d.dH)} kJ</span>`
    ]);
  }
};

const MODULES = [Mod1,Mod2,Mod3,Mod4,Mod5,Mod6,Mod7,Mod8,Mod9,Mod10];

function buildNav(){
  const select = document.getElementById("moduleSelect");
  select.innerHTML = MODULES.map((m,i) =>
    `<option value="${i}">${String(i+1).padStart(2,'0')} — ${m.title}</option>`
  ).join("");
  select.onchange = () => loadModule(parseInt(select.value));
}

function loadModule(i){
  currentModuleIdx = i;
  const mod = MODULES[i];
  mod.render();
  injectModuleScoreBadge();
  mod.solution(); // pre-fill solution steps so "Show Solution" works even before checking
  document.getElementById("moduleSelect").value = i;
}

function injectModuleScoreBadge(){
  const head = document.querySelector(".module-head");
  if(!head) return;
  const s = scoreByModule[currentModuleIdx] || {correct:0,total:0};
  const badge = document.createElement("span");
  badge.id = "modScoreBadge";
  badge.className = "mod-score-badge";
  badge.textContent = `this set: ${s.correct} / ${s.total}`;
  head.appendChild(badge);
}

        ${card("Thermochemical equations",

          rf("Reverse the equation → flip the sign of ΔH", "") +
          rf("Multiply the equation by k → multiply ΔH by k", ""))}
        ${card("Hess's law",
          rf("ΔH<sub>target</sub> = ΣΔH<sub>steps</sub>", "Reverse steps (flip sign) and scale them (multiply ΔH) until they add up to the target; cancel species that appear on both sides.") +
          rf("ΔH°<sub>rxn</sub> = ΣnΔH<sub>f</sub>°(products) − ΣnΔH<sub>f</sub>°(reactants)", "n = stoichiometric coefficient.") +
          rf("ΔH<sub>f</sub>° = 0 for elements in their standard state", "e.g. O₂(g), N₂(g), H₂(g), C(s, graphite)."))}
      </div>
      <div class="ref-grid">
        ${dataTable("Specific heats", SPECIFIC_HEAT, k => k, "J/(g·°C)")}
        ${dataTable("Standard enthalpies of formation, ΔH<sub>f</sub>°", HF, k => chem(k), "kJ/mol")}
        ${dataTable("Molar masses", MOLAR_MASS, k => chem(k), "g/mol")}
      </div>`;
    document.getElementById("refBody").innerHTML = html;

  }

  let lastFocus = null;
  function openRef(){

    overlay.classList.add("open");
    closeBtn.focus();
  }
  function closeRef(){
    overlay.classList.remove("open");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  refBtn.addEventListener("click", openRef);
  closeBtn.addEventListener("click", closeRef);
  overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) closeRef(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open")) closeRef();
  });

  /* ---- calculator (widget is wrapped so its helpers don't clash with the app's fmt()) ---- */
  let lastInput = null;
  document.addEventListener("focusin", (e) => {
    if (e.target.matches && e.target.matches("#content input")) lastInput = e.target;
  });
  document.getElementById("fab").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><rect x="8" y="5.5" width="8" height="4" rx="1"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg>';
  (function(){
/* ---------- expression engine (no eval) ---------- */
function tokenize(s) {
  const out = []; let i = 0;
  while (i < s.length) {
    const rest = s.slice(i); let m;
    if (/^\s/.test(rest)) { i++; continue; }
    if ((m = /^(\d+\.?\d*|\.\d+)(E[+-]?\d+)?/.exec(rest))) { out.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
    if ((m = /^(asin|acos|atan|sin|cos|tan|ln|log|sqrt|pi|ans|e)/.exec(rest))) {
      const w = m[1]; out.push({ t: (w === 'pi' || w === 'e' || w === 'ans') ? 'const' : 'fn', v: w }); i += w.length; continue;
    }
    if ('+-*/^()'.includes(rest[0])) { out.push({ t: 'op', v: rest[0] }); i++; continue; }
    throw new Error('Syntax error');
  }
  return out;
}
function evaluate(str, opts) {
  const tk = tokenize(str); let p = 0;
  const peek = () => tk[p], nxt = () => tk[p++];
  const isOp = (t, v) => t && t.t === 'op' && t.v === v;
  const starts = (t) => t && (t.t === 'num' || t.t === 'const' || t.t === 'fn' || isOp(t, '('));
  const toRad = (x) => (opts.deg ? x * Math.PI / 180 : x);
  const fromRad = (x) => (opts.deg ? x * 180 / Math.PI : x);
  const F = {
    sin: (x) => Math.sin(toRad(x)), cos: (x) => Math.cos(toRad(x)), tan: (x) => Math.tan(toRad(x)),
    asin: (x) => fromRad(Math.asin(x)), acos: (x) => fromRad(Math.acos(x)), atan: (x) => fromRad(Math.atan(x)),
    ln: Math.log, log: Math.log10, sqrt: Math.sqrt,
  };
  function expr() {
    let v = term();
    while (isOp(peek(), '+') || isOp(peek(), '-')) { const o = nxt().v; const r = term(); v = o === '+' ? v + r : v - r; }
    return v;
  }
  function term() {
    let v = unary();
    for (;;) {
      const t = peek();
      if (isOp(t, '*') || isOp(t, '/')) { nxt(); const r = unary(); v = t.v === '*' ? v * r : v / r; }
      else if (starts(t)) v *= unary();
      else return v;
    }
  }
  function unary() {
    if (isOp(peek(), '-')) { nxt(); return -unary(); }
    if (isOp(peek(), '+')) { nxt(); return unary(); }
    return power();
  }
  function power() {
    const b = primary();
    if (isOp(peek(), '^')) { nxt(); return Math.pow(b, unary()); }
    return b;
  }
  function primary() {
    const t = nxt();
    if (!t) throw new Error('Incomplete');
    if (t.t === 'num') return t.v;
    if (t.t === 'const') return t.v === 'pi' ? Math.PI : t.v === 'e' ? Math.E : opts.ans;
    if (t.t === 'fn') {
      if (!isOp(peek(), '(')) throw new Error('Use ( after ' + t.v);
      nxt(); const a = expr(); if (isOp(peek(), ')')) nxt();
      return F[t.v](a);
    }
    if (isOp(t, '(')) { const v = expr(); if (isOp(peek(), ')')) nxt(); return v; }
    throw new Error('Syntax error');
  }
  const v = expr();
  if (p < tk.length) throw new Error('Syntax error');
  if (!isFinite(v)) throw new Error('Math error');
  return v;
}
function fmt(x) {
  if (x === 0) return '0';
  const a = Math.abs(x);
  if (a >= 1e10 || a < 1e-6) return x.toExponential(6).replace(/\.?0+e/, 'e').replace('e+', 'e');
  return String(Number(x.toPrecision(10)));
}
const pretty = (s) => s.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−').replace(/pi/g, 'π').replace(/sqrt\(/g, '√(').replace(/asin\(/g, 'sin⁻¹(').replace(/acos\(/g, 'cos⁻¹(').replace(/atan\(/g, 'tan⁻¹(');

/* ---------- UI ---------- */
window.initCalculator = function (getLastInput) {
  const st = { expr: '', deg: true, inv: false, ans: 0, done: false, err: '' };
  const panel = document.getElementById('calc'), fab = document.getElementById('fab');
  const K = (label, act, cls, extra) => ({ label, act, cls: cls || '', extra: extra || '' });
  const rows = () => [
    [K('2nd', 'inv', st.inv ? 'on fn' : 'fn'), K(st.deg ? 'DEG' : 'RAD', 'deg', 'fn'), K('(', '('), K(')', ')'), K('⌫', 'back', 'clr')],
    [K(st.inv ? 'sin⁻¹' : 'sin', st.inv ? 'asin(' : 'sin(', 'fn'), K(st.inv ? 'cos⁻¹' : 'cos', st.inv ? 'acos(' : 'cos(', 'fn'), K(st.inv ? 'tan⁻¹' : 'tan', st.inv ? 'atan(' : 'tan(', 'fn'), K(st.inv ? 'eˣ' : 'ln', st.inv ? 'e^(' : 'ln(', 'fn'), K(st.inv ? '10ˣ' : 'log', st.inv ? '10^(' : 'log(', 'fn')],
    [K('√', 'sqrt(', 'fn'), K('x²', '^2', 'fn'), K('xʸ', '^', 'fn'), K('π', 'pi', 'fn'), K('e', 'e', 'fn')],
    [K('7', '7'), K('8', '8'), K('9', '9'), K('÷', '/', 'op'), K('C', 'clear', 'clr')],
    [K('4', '4'), K('5', '5'), K('6', '6'), K('×', '*', 'op'), K('Ans', 'ans', 'fn')],
    [K('1', '1'), K('2', '2'), K('3', '3'), K('−', '-', 'op'), K('EE', 'E', 'fn')],
    [K('0', '0'), K('.', '.'), K('+', '+', 'op'), K('=', '=', 'eq', 'grid-column:span 2')],
  ];
  panel.innerHTML = `
    <div class="calc-head" id="calcHead"><span class="grip"><span class="dots" aria-hidden="true">⠿</span>Calculator</span>
      <button type="button" id="calcClose" aria-label="Close calculator">&times;</button></div>
    <div class="disp"><div class="expr"><span id="cExpr"></span></div><div class="res" id="cRes">0</div>
      <div class="meta"><span id="cMode"></span><span>drag the header to move</span></div></div>
    <div class="keys" id="cKeys"></div>
    <div class="calc-foot"><button type="button" class="btn teal" id="cUse">Use result in answer box</button></div>`;
  const $ = (s) => panel.querySelector(s);

  function preview() {
    if (!st.expr.trim()) return { txt: '' };
    try { return { txt: fmt(evaluate(st.expr, st)) }; } catch (e) { return { txt: '' }; }
  }
  function paint() {
    const keys = $('#cKeys'), flat = rows().flat();
    keys.innerHTML = flat.map((k, i) => `<button type="button" data-i="${i}" class="${k.cls}" style="${k.extra}">${k.label}</button>`).join('');
    keys.onclick = (e) => { const b = e.target.closest('button'); if (b) press(flat[Number(b.dataset.i)].act); };
    keys.onmousedown = (e) => e.preventDefault();
    $('#cExpr').textContent = st.done ? pretty(st.shown) + ' =' : pretty(st.expr);
    const r = $('#cRes');
    if (st.err) r.textContent = st.err;
    else if (st.done && !st.expr) r.textContent = fmt(st.ans);
    else r.textContent = preview().txt || '0';
    r.classList.toggle('err', !!st.err);
    $('#cMode').textContent = (st.deg ? 'degrees' : 'radians') + (st.ans ? '   ans = ' + fmt(st.ans) : '');
  }
  function append(s) {
    if (st.done) {
      st.done = false;
      st.expr = (/^[+\-*/^]/.test(s) ? 'ans' : '') + s;   // operators continue from the last answer
      return;
    }
    st.expr += s;
  }
  function press(a) {
    st.err = '';
    if (a === 'inv') st.inv = !st.inv;
    else if (a === 'deg') st.deg = !st.deg;
    else if (a === 'clear') { st.expr = ''; st.done = false; }
    else if (a === 'back') {
      if (st.done) { st.done = false; st.expr = ''; }
      else st.expr = st.expr.replace(/(asin\(|acos\(|atan\(|sqrt\(|sin\(|cos\(|tan\(|log\(|ln\(|ans|pi|.)$/, '');
    } else if (a === '=') {
      if (st.expr.trim()) {
        try { st.ans = evaluate(st.expr, st); st.shown = st.expr; st.expr = ''; st.done = true; }
        catch (e) { st.err = e.message; }
      }
    } else append(a);
    paint();
  }

  /* open/close */
  function setOpen(o) {
    panel.hidden = !o; fab.setAttribute('aria-expanded', String(o));
    fab.setAttribute('aria-label', o ? 'Close calculator' : 'Open calculator');
    if (o) paint();
  }
  fab.onclick = () => setOpen(panel.hidden);
  $('#calcClose').onclick = () => setOpen(false);
  fab.setAttribute('aria-controls', 'calc'); setOpen(false);

  /* insert result into the last-focused answer box */
  $('#cUse').onclick = () => {
    const inp = getLastInput && getLastInput();
    let v = st.done ? st.ans : (() => { try { return evaluate(st.expr || '0', st); } catch (e) { return NaN; } })();
    if (!isFinite(v) || !inp || !document.contains(inp) || inp.disabled) {
      $('#cUse').textContent = inp && !inp.disabled ? 'Nothing to insert yet' : 'Tap an answer box first';
      setTimeout(() => { $('#cUse').textContent = 'Use result in answer box'; }, 1400); return;
    }
    inp.value = String(Number(v.toPrecision(6)));
    $('#cUse').textContent = 'Inserted';
    setTimeout(() => { $('#cUse').textContent = 'Use result in answer box'; }, 1000);
  };

  /* keyboard (only when focus is not in a form field) */
  document.addEventListener('keydown', (e) => {
    if (panel.hidden || /^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || ''))) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (/^[0-9.]$/.test(k) || '+-*/^()'.includes(k)) { press(k); e.preventDefault(); }
    else if (k === 'Enter' || k === '=') { press('='); e.preventDefault(); }
    else if (k === 'Backspace') { press('back'); e.preventDefault(); }
    else if (k === 'Escape') { setOpen(false); }
    else if (k === 'p') press('pi'); else if (k === 'e') press('e');
  });

  /* drag by header (mouse, touch, pen) */
  const head = $('#calcHead'); let drag = null;
  head.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    const r = panel.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    panel.style.left = r.left + 'px'; panel.style.top = r.top + 'px'; panel.style.right = 'auto'; panel.style.bottom = 'auto';
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const x = Math.min(Math.max(4, e.clientX - drag.dx), window.innerWidth - w - 4);
    const y = Math.min(Math.max(4, e.clientY - drag.dy), window.innerHeight - h - 4);
    panel.style.left = x + 'px'; panel.style.top = y + 'px';
  });
  const end = () => { drag = null; };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
  window.addEventListener('resize', () => {
    if (panel.style.left) {
      const r = panel.getBoundingClientRect();
      panel.style.left = Math.min(Math.max(4, r.left), Math.max(4, window.innerWidth - r.width - 4)) + 'px';
      panel.style.top = Math.min(Math.max(4, r.top), Math.max(4, window.innerHeight - r.height - 4)) + 'px';
    }
  });
};

})();
  window.initCalculator(() => lastInput);
})();

buildNav();
loadModule(0);
</script>
