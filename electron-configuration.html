<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electron Configuration Trainer</title>
  <style>
    :root {
      font-size: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #fafafa;
      color: #222;
    }

    header {
      padding: 1rem;
      background: #283593;
      color: #fff;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    main {
      padding: 1rem;
      max-width: 800px;
      margin: 0 auto;
    }

    section {
      margin-bottom: 1.5rem;
    }

    h2 {
      margin-top: 0;
      font-size: 1.1rem;
    }

    button,
    select,
    input[type="text"] {
      font-size: 1rem;
      padding: 0.75rem 1rem;
      margin: 0.25rem 0;
      width: 100%;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #3949ab;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      background-color: #b0bec5;
      cursor: default;
    }

    button:hover:not(:disabled) {
      background-color: #303f9f;
    }

    label {
      display: block;
      margin-top: 0.5rem;
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }

    fieldset {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      margin: 0.5rem 0;
    }

    legend {
      font-size: 0.9rem;
      padding: 0 0.25rem;
    }

    .buttons-row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    @media (min-width: 600px) {
      .buttons-row {
        flex-direction: row;
      }
      button {
        width: auto;
        flex: 1;
      }
    }

    #practice-score,
    #game-score,
    #practice-feedback,
    #game-feedback,
    #game-progress {
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    #practice-mistakes {
      margin-top: 0.75rem;
      font-size: 0.9rem;
    }

    .mistake-part {
      padding: 0.2rem 0.3rem;
      margin: 0.1rem;
      border-radius: 3px;
      display: inline-block;
    }

    .mistake-correct {
      background-color: #e0f7e9;
    }

    .mistake-wrong {
      background-color: #fde0e0;
    }

    .mistake-missing {
      background-color: #fff4d6;
    }

    #practice-mistakes-legend {
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .legend-item {
      display: inline-block;
      margin-right: 0.5rem;
    }

    .legend-correct {
      color: #1a7f3c;
    }

    .legend-wrong {
      color: #c62828;
    }

    .legend-missing {
      color: #e65100;
    }

    .practice-mistakes-summary {
      margin-bottom: 0.25rem;
      font-size: 0.85rem;
      font-style: italic;
    }

    /* Simple divider */
    .divider {
      height: 1px;
      background: #ddd;
      margin: 1rem 0;
    }

    /* Mini periodic table */
    .mini-ptable {
      display: grid;
      grid-template-columns: repeat(18, minmax(0, 1fr));
      gap: 1px;
      margin-top: 0.75rem;
      max-width: 100%;
    }

    .mini-ptable .cell {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.5rem;
      line-height: 1;
      border-radius: 2px;
      background-color: #e8eaf6;
      color: #444;
      user-select: none;
    }

    @media (min-width: 600px) {
      .mini-ptable .cell {
        font-size: 0.6rem;
      }
    }

    .mini-ptable .cell.block-s { background-color: #ffe0b2; }
    .mini-ptable .cell.block-p { background-color: #c8e6c9; }
    .mini-ptable .cell.block-d { background-color: #bbdefb; }
    .mini-ptable .cell.block-f { background-color: #e1bee7; }

    .mini-ptable .cell.current {
      background-color: #3949ab;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 0 0 1px #1a237e;
    }

    .mini-ptable .cell.empty {
      background: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Electron Configuration Trainer</h1>
  </header>

  <main>
    <!-- Home view -->
    <section id="home-view">
      <h2>Modes</h2>
      <button id="practice-btn">Practice Mode</button>
      <button id="game-btn">Game Mode</button>

      <div class="divider"></div>

      <h2>Game options</h2>
      <label for="game-length">Game length:</label>
      <select id="game-length">
        <option value="10">10 elements</option>
        <option value="20">20 elements</option>
        <option value="30">30 elements</option>
        <option value="40">40 elements</option>
        <option value="50">50 elements</option>
      </select>
    </section>

    <!-- Practice view -->
    <section id="practice-view" hidden>
      <h2>Practice Mode</h2>

      <label for="practice-element">Choose element:</label>
      <select id="practice-element"></select>

      <fieldset id="practice-format">
        <legend>Answer format</legend>
        <label>
          <input type="radio" name="practiceFormat" value="long" checked>
          Long configuration
        </label>
        <label>
          <input type="radio" name="practiceFormat" value="short">
          Noble gas shorthand
        </label>
        <label>
          <input type="radio" name="practiceFormat" value="either">
          Accept either
        </label>
      </fieldset>

      <label>
        <input type="checkbox" id="practice-show-mistakes" checked>
        Show mistakes for this answer
      </label>

      <label for="practice-input">Electron configuration:</label>
      <input id="practice-input" type="text" autocomplete="off" />

      <div class="buttons-row">
        <button id="practice-check">Check answer</button>
        <button id="practice-show">Show answer</button>
        <button id="practice-reset">Reset answer</button>
        <button id="practice-back">Back</button>
      </div>

      <p id="practice-feedback"></p>
      <p id="practice-score">Score: 0 / 0</p>

      <div id="practice-periodic-table" class="mini-ptable"></div>

      <div id="practice-mistakes"></div>

      <div id="practice-mistakes-legend">
        <span class="legend-item legend-correct">Green: correct subshell</span>
        <span class="legend-item legend-wrong">Red: incorrect or extra subshell</span>
        <span class="legend-item legend-missing">Orange: missing subshell</span>
      </div>
    </section>

    <!-- Game view -->
    <section id="game-view" hidden>
      <h2>Game Mode</h2>
      <p id="game-progress"></p>
      <p id="game-element-label"></p>

      <input id="game-input" type="text" autocomplete="off" />

      <div class="buttons-row">
        <button id="game-check">Check answer</button>
        <button id="game-reset">Reset answer</button>
        <button id="game-next" disabled>Next</button>
        <button id="game-end">End game</button>
      </div>

      <p id="game-feedback"></p>
      <p id="game-score">Score: 0 / 0</p>

      <div id="game-periodic-table" class="mini-ptable"></div>
    </section>
  </main>

      // f-block examples (lanthanides/actinides placeholders)

    // Extend to all 118 following this structure.

      2: { long: "1s2", short: "[He]" },
      11: { long: "1s2 2s2 2p6 3s1", short: "[Ne] 3s1" },

        short: "[Xe] 6s1 4f14 5d10"

      102:{ long: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 5s2 4d10 5p6 6s2 4f14 5d10 6p6 7s1 5f14", short: "[Rn] 7s1 5f14" },
      106:{ long: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 5s2 4d10 5p6 6s2 4f14 5d10 6p6 7s1 5f14 6d5", short: "[Rn] 7s1 5f14 6d5" },
      111:{ long: "1s2 2s2 2p6 3s2 3p6 4s2 3d10 5s2 4d10 5p6 6s2 4f14 5d10 6p6 7s1 5f14 6d10", short: "[Rn] 7s1 5f14 6d10" }
      // Fill in all other elements with accurate long/short configs.
    };

    // Fallback: simple Aufbau-like builder if a config is missing.
    const subshellOrder = [
      "1s", "2s", "2p",
      "3s", "3p", "4s",
      "3d", "4p", "5s",
      "4d", "5p", "6s",
      "4f", "5d", "6p", "7s",
      "5f", "6d", "7p"
    ];

    const subshellCapacity = { s: 2, p: 6, d: 10, f: 14 };

    function buildConfigAtomicNumber(Z) {
      const parts = [];
      let remaining = Z;
      for (const subshell of subshellOrder) {
        if (remaining <= 0) break;
        const l = subshell.slice(-1);
        const cap = subshellCapacity[l];
        const fill = Math.min(cap, remaining);
        parts.push(subshell + fill);
        remaining -= fill;
      }
      return parts.join(" ");
    }

    // Noble gases used as shorthand reference points, in increasing Z order.
    const nobleGases = [
      { Z: 2, symbol: "He" },
      { Z: 10, symbol: "Ne" },
      { Z: 18, symbol: "Ar" },
      { Z: 36, symbol: "Kr" },
      { Z: 54, symbol: "Xe" },
      { Z: 86, symbol: "Rn" }
    ];

    function buildShorthandFromLong(Z, long) {
      // Find the largest noble gas with a smaller atomic number.
      let ng = null;
      for (const g of nobleGases) {
        if (g.Z < Z) {
          ng = g;
        } else {
          break;
        }
      }
      if (!ng) return long; // H and He have no smaller noble gas to reference

      const ngConfig = buildConfigAtomicNumber(ng.Z);
      if (long.startsWith(ngConfig)) {
        const remainder = long.slice(ngConfig.length).trim();
        return remainder ? `[${ng.symbol}] ${remainder}` : `[${ng.symbol}]`;
      }
      return long; // fallback safety net; shouldn't happen for aufbau-ordered configs
    }

    function getElectronConfigVariants(Z) {
      const existing = elementConfigs[Z];
      if (existing) return existing;

      const long = buildConfigAtomicNumber(Z);
      const short = buildShorthandFromLong(Z, long);
      return { long, short };
    }

      [107, "Bh", 7, 7, "d"], [108, "Hs", 7, 8, "d"], [109, "Mt", 7, 9, "d"],

      [116, "Lv", 7, 16, "p"], [117, "Ts", 7, 17, "p"], [118, "Og", 7, 18, "p"]

    function renderPeriodicTable(containerId, highlightZ) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = "";

      // Spacer row between main body and the f-block rows.
      for (let col = 1; col <= 18; col++) {
        const spacer = document.createElement("div");
        spacer.classList.add("cell", "empty");
        spacer.style.gridRow = "8";
        spacer.style.gridColumn = String(col);
        container.appendChild(spacer);
      }

      periodicLayout.forEach(([Z, symbol, row, col, block]) => {
        const cell = document.createElement("div");
        cell.classList.add("cell", `block-${block}`);
        cell.style.gridRow = String(row);
        cell.style.gridColumn = String(col);
        cell.textContent = symbol;
        cell.title = `${symbol} (Z=${Z})`;
        if (Z === highlightZ) {
          cell.classList.add("current");
        }
        container.appendChild(cell);
      });
    }

    /****************************************************************
     * Normalization and tokenization (flexible formatting)
     ****************************************************************/

    function normalizeConfigFlexible(str) {
      if (!str) return "";
      let s = str.trim().toLowerCase();
      s = s.replace(/\s+/g, " ");
      s = s.replace(/\[\s*([a-z]{1,2})\s*\]/g, "[$1]");
      s = s.replace(/\]\s+/g, "]");
      s = s.replace(/(\d+[spdf])\s+(\d+)/g, "$1$2");
      s = s.replace(/\s+/g, " ");
      return s;
    }

    function tokenizeConfig(normStr) {
      if (!normStr) return [];
      const tokens = [];
      let s = normStr;

      const nobleMatch = s.match(/^\[[a-z]{1,2}\]/);
      if (nobleMatch) {
        tokens.push(nobleMatch[0]);
        s = s.slice(nobleMatch[0].length);
      }

      const parts = s.trim().length ? s.trim().split(" ") : [];
      for (const part of parts) {
        if (!part) continue;
        tokens.push(part);
      }

      return tokens;
    }

    function diffConfigTokens(correctTokens, userTokens) {
      const maxLen = Math.max(correctTokens.length, userTokens.length);
      const result = [];

      for (let i = 0; i < maxLen; i++) {
        const correctTok = correctTokens[i] || null;
        const userTok = userTokens[i] || null;

        if (correctTok && userTok) {
          if (correctTok === userTok) {
            result.push({ type: "correct", correct: correctTok, user: userTok });
          } else {
            result.push({ type: "wrong", correct: correctTok, user: userTok });
          }
        } else if (correctTok && !userTok) {
          result.push({ type: "missing", correct: correctTok, user: null });
        } else if (!correctTok && userTok) {
          result.push({ type: "extra", correct: null, user: userTok });
        }
      }

      return result;
    }

    function summarizeDiff(diff) {
      const summary = { correct: 0, wrong: 0, missing: 0, extra: 0 };
      diff.forEach(item => {
        if (summary[item.type] != null) {
          summary[item.type]++;
        }
      });
      return summary;
    }

    function renderPracticeMistakes(diff) {
      const container = document.getElementById("practice-mistakes");
      container.innerHTML = "";
      if (!diff.length) return;

      const summary = summarizeDiff(diff);
      const hasMistakes =
        summary.wrong > 0 || summary.missing > 0 || summary.extra > 0;

      if (hasMistakes) {
        const summaryP = document.createElement("p");
        summaryP.classList.add("practice-mistakes-summary");
        summaryP.textContent =
          `Summary: ${summary.correct} correct, ${summary.wrong} wrong, ` +
          `${summary.missing} missing, ${summary.extra} extra subshells.`;
        container.appendChild(summaryP);
      }

      const frag = document.createDocumentFragment();

      diff.forEach(item => {
        const span = document.createElement("span");
        span.classList.add("mistake-part");

        if (item.type === "correct") {
          span.classList.add("mistake-correct");
          span.textContent = item.correct;
        } else if (item.type === "wrong") {
          span.classList.add("mistake-wrong");
          span.textContent = `${item.user} → ${item.correct}`;
        } else if (item.type === "missing") {
          span.classList.add("mistake-missing");
          span.textContent = `∅ → ${item.correct}`;
        } else if (item.type === "extra") {
          span.classList.add("mistake-wrong");
          span.textContent = `${item.user} (extra)`;
        }

        frag.appendChild(span);
      });

      container.appendChild(frag);
    }

    /****************************************************************
     * Practice mode logic
     ****************************************************************/

    let practiceCorrect = 0;
    let practiceTries = 0;

    function updatePracticeScore() {
      document.getElementById("practice-score").textContent =
        `Score: ${practiceCorrect} / ${practiceTries}`;
    }

    function getSelectedPracticeFormat() {
      const radios = document.querySelectorAll("input[name='practiceFormat']");
      for (const r of radios) {
        if (r.checked) return r.value;
      }
      return "long";
    }

    function checkPractice() {
      const Z = parseInt(document.getElementById("practice-element").value, 10);
      const variants = getElectronConfigVariants(Z);
      const format = getSelectedPracticeFormat();

      const rawUser = document.getElementById("practice-input").value;
      const userNorm = normalizeConfigFlexible(rawUser);
      const longNorm = normalizeConfigFlexible(variants.long);
      const shortNorm = normalizeConfigFlexible(variants.short);

      practiceTries++;
      let correct = false;
      let canonicalNorm;

      if (format === "long") {
        canonicalNorm = longNorm;
        correct = userNorm === longNorm;
      } else if (format === "short") {
        canonicalNorm = shortNorm;
        correct = userNorm === shortNorm;
      } else {
        if (userNorm === longNorm) {
          canonicalNorm = longNorm;
          correct = true;
        } else if (userNorm === shortNorm) {
          canonicalNorm = shortNorm;
          correct = true;
        } else {
          canonicalNorm = longNorm;
          correct = false;
        }
      }

      document.getElementById("practice-feedback").textContent =
        correct
          ? "Correct!"
          : "Incorrect. Exponents (e.g. 3s1) are required; spacing/case can vary.";

      if (correct) practiceCorrect++;
      updatePracticeScore();

      const showMistakes = document.getElementById("practice-show-mistakes").checked;
      if (showMistakes) {
        const correctTokens = tokenizeConfig(canonicalNorm);
        const userTokens = tokenizeConfig(userNorm);
        const diff = diffConfigTokens(correctTokens, userTokens);
        renderPracticeMistakes(diff);
      } else {
        document.getElementById("practice-mistakes").innerHTML = "";
      }
    }

    function showPracticeAnswer() {
      const Z = parseInt(document.getElementById("practice-element").value, 10);
      const variants = getElectronConfigVariants(Z);
      const format = getSelectedPracticeFormat();

      let answerText;
      if (format === "long") {
        answerText = `Long: ${variants.long}`;
      } else if (format === "short") {
        answerText = `Shorthand: ${variants.short}`;
      } else {
        answerText = `Long: ${variants.long}\nShorthand: ${variants.short}`;
      }

      document.getElementById("practice-feedback").textContent = answerText;

      // Optionally count "Show answer" as a try
      practiceTries++;
      updatePracticeScore();

      // Do not compute mistakes on "Show answer"
      document.getElementById("practice-mistakes").innerHTML = "";
    }

    function resetPractice() {
      document.getElementById("practice-input").value = "";
      document.getElementById("practice-feedback").textContent = "";
      document.getElementById("practice-mistakes").innerHTML = "";
      // Score, element, format, and checkbox state are preserved
    }

    function setupPractice() {
      const select = document.getElementById("practice-element");
      elements.forEach(el => {
        const opt = document.createElement("option");
        opt.value = el.Z;
        opt.textContent = `${el.symbol} (${el.Z})`;
        select.appendChild(opt);
      });

      document.getElementById("practice-check").addEventListener("click", checkPractice);
      document.getElementById("practice-show").addEventListener("click", showPracticeAnswer);
      document.getElementById("practice-reset").addEventListener("click", resetPractice);
      document.getElementById("practice-back").addEventListener("click", () => {
        document.getElementById("practice-view").hidden = true;
        document.getElementById("home-view").hidden = false;
      });

      select.addEventListener("change", () => {
        renderPeriodicTable("practice-periodic-table", parseInt(select.value, 10));
      });

      renderPeriodicTable("practice-periodic-table", parseInt(select.value, 10));
    }

    /****************************************************************
     * Game mode logic
     ****************************************************************/

    let gameSet = [];
    let gameIndex = 0;
    let gameCorrect = 0;
    let gameTries = 0;

    function updateGameScore() {
      document.getElementById("game-score").textContent =
        `Score: ${gameCorrect} / ${gameTries}`;
    }

    function randomFormat() {
      return Math.random() < 0.5 ? "long" : "short";
    }

    function sampleArr(arr, count) {
      const copy = [...arr];
      const result = [];
      for (let i = 0; i < count; i++) {
        const idx = Math.floor(Math.random() * copy.length);
        result.push(copy[idx]);
        copy.splice(idx, 1);
      }
      return result;
    }

    function buildGameSet(n) {
      const dElements = elements.filter(e => e.hasD);
      const fElements = elements.filter(e => e.hasF);
      const others = elements.filter(e => !e.hasD && !e.hasF);

      if (dElements.length < 2 || fElements.length < 2 || elements.length < n) {
        throw new Error("Insufficient elements to build requested set.");
      }

      const pickedD = sampleArr(dElements, 2);
      const pickedF = sampleArr(fElements, 2);
      const remainingNeeded = n - 4;

      const pool = elements.filter(
        e => !pickedD.includes(e) && !pickedF.includes(e)
      );
      const pickedOthers = sampleArr(pool, remainingNeeded);

      const finalSet = [...pickedD, ...pickedF, ...pickedOthers];

      for (let i = finalSet.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [finalSet[i], finalSet[j]] = [finalSet[j], finalSet[i]];
      }

      return finalSet.map(el => ({
        ...el,
        format: randomFormat()
      }));
    }

    function showCurrentGameElement() {
      const current = gameSet[gameIndex];
      document.getElementById("game-element-label").textContent =
        `Element: ${current.symbol} (${current.Z})`;

      const formatHint = current.format === "short"
        ? "Use noble-gas shorthand."
        : "Use full (long) configuration.";

      document.getElementById("game-progress").textContent =
        `Question ${gameIndex + 1} of ${gameSet.length} — ${formatHint}`;

      document.getElementById("game-input").value = "";
      document.getElementById("game-feedback").textContent = "";
      document.getElementById("game-next").disabled = true;

      renderPeriodicTable("game-periodic-table", current.Z);

      updateGameScore();
    }

    function checkGame() {
      const current = gameSet[gameIndex];
      const variants = getElectronConfigVariants(current.Z);

      const rawUser = document.getElementById("game-input").value;
      const userNorm = normalizeConfigFlexible(rawUser);
      const longNorm = normalizeConfigFlexible(variants.long);
      const shortNorm = normalizeConfigFlexible(variants.short);

      const correctNorm =
        current.format === "short" ? shortNorm : longNorm;

      gameTries++;
      if (userNorm === correctNorm) {
        gameCorrect++;
        document.getElementById("game-feedback").textContent =
          "Correct!";
        document.getElementById("game-next").disabled = false;
      } else {
        document.getElementById("game-feedback").textContent =
          "Incorrect. Ensure exponents and required format (long vs shorthand).";
      }
      updateGameScore();
    }

    function resetGameAnswer() {
      document.getElementById("game-input").value = "";
      document.getElementById("game-feedback").textContent = "";
      // Score, index, and game set stay unchanged
    }

    function nextGameElement() {
      if (gameIndex < gameSet.length - 1) {
        gameIndex++;
        showCurrentGameElement();
      } else {
        document.getElementById("game-feedback").textContent =
          "Game complete!";
      }
    }

    function startGame() {
      const n = parseInt(document.getElementById("game-length").value, 10);
      gameSet = buildGameSet(n);
      gameIndex = 0;
      gameCorrect = 0;
      gameTries = 0;
      showCurrentGameElement();
    }

    function setupGame() {
      document.getElementById("game-check").addEventListener("click", checkGame);
      document.getElementById("game-reset").addEventListener("click", resetGameAnswer);
      document.getElementById("game-next").addEventListener("click", nextGameElement);
      document.getElementById("game-end").addEventListener("click", () => {
        document.getElementById("home-view").hidden = false;
        document.getElementById("game-view").hidden = true;
      });

      document.getElementById("game-btn").addEventListener("click", () => {
        document.getElementById("home-view").hidden = true;
        document.getElementById("game-view").hidden = false;
        startGame();
      });
    }

    /****************************************************************
     * App initialization
     ****************************************************************/

    function initApp() {
      setupPractice();
      setupGame();

      document.getElementById("practice-btn").addEventListener("click", () => {
        document.getElementById("home-view").hidden = true;
        document.getElementById("practice-view").hidden = false;
      });
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
